name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions are pinned to a full commit SHA so a compromised tag cannot change what runs.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (includes architecture boundary rules)
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Unit tests with coverage thresholds
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Verify build output against the Content-Security-Policy
        run: npm run verify:dist

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
